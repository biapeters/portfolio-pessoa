<head>
    <meta charset="UTF-8">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><path fill='%23a08cf5' d='M1 1h6v6H1z'/><path fill='%23fff' d='M2 3h1v1H2zM5 3h1v1H5zM3 5h2v1H3z'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script>
        // Aplica o tema antes de renderizar, para não piscar a tela
        try {
            const saved = localStorage.getItem('theme');
            const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
            if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
